          echo "Wave 3: running $W_READERS readers over $W_MINS minutes"
          SPREAD_MINUTES="$W_MINS" ./run-camoufox.sh "${{ inputs.article_url }}" "$W_READERS" "${{ inputs.seconds }}"

  wave-4:
    name: Wave 4
    needs: wave-3
    if: ${{ always() && !cancelled() && fromJSON(inputs.hours || '0') > 12 }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install
      - run: npx playwright-core install-deps firefox
      - uses: actions/cache@v4
        with:
          path: ~/.cache/camoufox
          key: camoufox-binary-${{ runner.os }}-v1
      - run: test -f ~/.cache/camoufox/version.json || npx camoufox-js fetch
      - name: Run Wave 4
        run: |
