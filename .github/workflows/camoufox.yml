name: camoufox-readers

on:
  workflow_dispatch:
    inputs:
      article_url:
        description: 'Target URL'
        required: true
        default: 'https://example.com'
      readers:
        description: 'Count (total across all days)'
        required: false
        default: '30'
      concurrency:
        description: 'Concurrency'
        required: false
        default: '20'
      seconds:
        description: 'Duration (s)'
        required: false
        default: '300'
      traffic:
        description: 'Source'
        required: false
        default: 'mix'
      country:
        description: 'Geo'
        required: false
        default: 'auto'
      bounce_pct:
        description: 'Rate'
        required: false
        default: '0.20'
      block_images:
        description: 'Opt'
        required: false
        default: '1'
      hours:
        description: 'Hours per day (0 = fast, 12 = 3 waves, 24 = 6 waves)'
        required: false
        default: '0'
      days:
        description: 'Days (1 = single day, 2..14 = auto-chained multi-day campaign)'
        required: false
        default: '1'

env:
  DATAIMPULSE_LOGIN:           ${{ secrets.DATAIMPULSE_LOGIN }}
  DATAIMPULSE_PASSWORD:        ${{ secrets.DATAIMPULSE_PASSWORD }}
  DATAIMPULSE_MOBILE_LOGIN:    ${{ secrets.DATAIMPULSE_MOBILE_LOGIN }}
  DATAIMPULSE_MOBILE_PASSWORD: ${{ secrets.DATAIMPULSE_MOBILE_PASSWORD }}
  DATAIMPULSE_HOST:            ${{ secrets.DATAIMPULSE_HOST || 'gw.dataimpulse.com' }}
  DATAIMPULSE_PORT:            ${{ secrets.DATAIMPULSE_PORT || '823' }}
  DECODO_LOGIN:                ${{ secrets.DECODO_LOGIN }}
  DECODO_PASSWORD:             ${{ secrets.DECODO_PASSWORD }}
  APP_KEY:                     ${{ secrets.APP_KEY }}
  TRAFFIC:                     ${{ inputs.traffic }}
  COUNTRY:                     ${{ inputs.country }}
  CONCURRENCY:                 ${{ inputs.concurrency }}
  BOUNCE_PCT:                  ${{ inputs.bounce_pct }}
  BLOCK_IMAGES:                ${{ inputs.block_images }}
  TOTAL_READERS:               ${{ inputs.readers }}
  TOTAL_HOURS:                 ${{ inputs.hours || '0' }}
  TOTAL_DAYS:                  ${{ inputs.days || '1' }}
  HEADLESS:                    '1'

jobs:
  wait-active:
    name: Queue Behind Active Run (Stage 1)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Wait for any earlier in-progress workflow run for this article to finish
        run: |
          CUR_ID="${{ github.run_id }}"
          WAITED=0
          while [ "$WAITED" -lt 350 ]; do
            ACTIVE=$(curl -s "https://api.github.com/repos/${{ github.repository }}/actions/runs?status=in_progress&per_page=20" | python3 -c "import sys,json; cur=int('$CUR_ID'); url='${{ inputs.article_url }}'.rstrip('/'); d=json.load(sys.stdin); earlier=[r for r in d.get('workflow_runs',[]) if int(r['id'])<cur]; same=[r['id'] for r in earlier if r.get('display_title','')=='camoufox-readers' or (url and url in r.get('display_title',''))]; busy=[r['id'] for r in earlier] if len(earlier)>=3 else []; b=same or busy; print(b[0] if b else '')" 2>/dev/null || true)
            if [ -z "$ACTIVE" ]; then
              echo "No conflicting run in progress. Proceeding."
              break
            fi
            echo "Waiting for earlier run #$ACTIVE to finish ($WAITED/350m)..."
            sleep 60
            WAITED=$((WAITED + 1))
          done

  wait-active-2:
    name: Queue Behind Active Run (Stage 2)
    needs: wait-active
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Continue waiting if earlier run for this article is still in progress
        run: |
          CUR_ID="${{ github.run_id }}"
          WAITED=0
          while [ "$WAITED" -lt 350 ]; do
            ACTIVE=$(curl -s "https://api.github.com/repos/${{ github.repository }}/actions/runs?status=in_progress&per_page=20" | python3 -c "import sys,json; cur=int('$CUR_ID'); url='${{ inputs.article_url }}'.rstrip('/'); d=json.load(sys.stdin); earlier=[r for r in d.get('workflow_runs',[]) if int(r['id'])<cur]; same=[r['id'] for r in earlier if r.get('display_title','')=='camoufox-readers' or (url and url in r.get('display_title',''))]; busy=[r['id'] for r in earlier] if len(earlier)>=3 else []; b=same or busy; print(b[0] if b else '')" 2>/dev/null || true)
            if [ -z "$ACTIVE" ]; then
              echo "No conflicting run in progress. Starting campaign now."
              break
            fi
            echo "Waiting for earlier run #$ACTIVE to finish ($WAITED/350m)..."
            sleep 60
            WAITED=$((WAITED + 1))
          done

  wave-1:
    name: Wave 1
    needs: wait-active-2
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install
      - run: for a in 1 2 3 4; do npx playwright-core install-deps firefox && break; sudo apt-get update -y || true; sleep 15; done
      - uses: actions/cache@v4
        with:
          path: ~/.cache/camoufox
          key: camoufox-binary-${{ runner.os }}-v1
      - run: for a in 1 2 3 4 5; do test -f ~/.cache/camoufox/version.json && break; npx camoufox-js fetch && break; rm -rf ~/.cache/camoufox; sleep 15; done
      - name: Run Wave 1
        run: |
          chmod +x run-camoufox.sh
          read W_READERS W_MINS < <(python3 -c "import math,random; rng=random.Random(int('${{ github.run_id }}')); tot_r=max(1,int('${TOTAL_READERS:-30}')); d=max(1,int(float('${TOTAL_DAYS:-1}'))); r=max(1,min(tot_r-(d-1),int(round((tot_r/d)*rng.uniform(0.76,1.28)))+rng.choice([-3,-2,-1,1,2,3]))) if d>1 else tot_r; h=float('${TOTAL_HOURS:-0}'); w=max(1,min(6,int(math.ceil(h/4.0)))) if h>0 else 1; raw=[rng.uniform(0.58,1.48) for _ in range(w)]; s=sum(raw); cnts=[max(1,int(round(r*x/s))+rng.choice([-4,-3,-2,-1,1,2,3,4])) for x in raw]; base_m=int(round((h/w)*60)) if h>0 else 0; mins=[max(10,base_m+rng.randint(-15,14)) if base_m>30 else base_m for _ in range(w)]; print(cnts[0], mins[0])")
          echo "Wave 1: running $W_READERS readers over $W_MINS minutes (days left: ${TOTAL_DAYS:-1})"
          SPREAD_MINUTES="$W_MINS" ./run-camoufox.sh "${{ inputs.article_url }}" "$W_READERS" "${{ inputs.seconds }}"

  wave-2:
    name: Wave 2
    needs: wave-1
    if: ${{ always() && !cancelled() && fromJSON(inputs.hours || '0') > 4 }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install
      - run: for a in 1 2 3 4; do npx playwright-core install-deps firefox && break; sudo apt-get update -y || true; sleep 15; done
      - uses: actions/cache@v4
        with:
          path: ~/.cache/camoufox
          key: camoufox-binary-${{ runner.os }}-v1
      - run: for a in 1 2 3 4 5; do test -f ~/.cache/camoufox/version.json && break; npx camoufox-js fetch && break; rm -rf ~/.cache/camoufox; sleep 15; done
      - name: Run Wave 2
        run: |
          chmod +x run-camoufox.sh
          read W_READERS W_MINS < <(python3 -c "import math,random; rng=random.Random(int('${{ github.run_id }}')); tot_r=max(1,int('${TOTAL_READERS:-30}')); d=max(1,int(float('${TOTAL_DAYS:-1}'))); r=max(1,min(tot_r-(d-1),int(round((tot_r/d)*rng.uniform(0.76,1.28)))+rng.choice([-3,-2,-1,1,2,3]))) if d>1 else tot_r; h=float('${TOTAL_HOURS:-0}'); w=max(1,min(6,int(math.ceil(h/4.0)))) if h>0 else 1; raw=[rng.uniform(0.58,1.48) for _ in range(w)]; s=sum(raw); cnts=[max(1,int(round(r*x/s))+rng.choice([-4,-3,-2,-1,1,2,3,4])) for x in raw]; base_m=int(round((h/w)*60)) if h>0 else 0; mins=[max(10,base_m+rng.randint(-15,14)) if base_m>30 else base_m for _ in range(w)]; print(cnts[1], mins[1])")
          echo "Wave 2: running $W_READERS readers over $W_MINS minutes (days left: ${TOTAL_DAYS:-1})"
          SPREAD_MINUTES="$W_MINS" ./run-camoufox.sh "${{ inputs.article_url }}" "$W_READERS" "${{ inputs.seconds }}"

  wave-3:
    name: Wave 3
    needs: [wave-1, wave-2]
    if: ${{ always() && !cancelled() && fromJSON(inputs.hours || '0') > 8 }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install
      - run: for a in 1 2 3 4; do npx playwright-core install-deps firefox && break; sudo apt-get update -y || true; sleep 15; done
      - uses: actions/cache@v4
        with:
          path: ~/.cache/camoufox
          key: camoufox-binary-${{ runner.os }}-v1
      - run: for a in 1 2 3 4 5; do test -f ~/.cache/camoufox/version.json && break; npx camoufox-js fetch && break; rm -rf ~/.cache/camoufox; sleep 15; done
      - name: Run Wave 3
        run: |
          chmod +x run-camoufox.sh
          RESULTS="${{ needs.wave-1.result }},${{ needs.wave-2.result }}"
          read W_READERS W_MINS < <(python3 -c "import math,random; rng=random.Random(int('${{ github.run_id }}')); tot_r=max(1,int('${TOTAL_READERS:-30}')); d=max(1,int(float('${TOTAL_DAYS:-1}'))); r=max(1,min(tot_r-(d-1),int(round((tot_r/d)*rng.uniform(0.76,1.28)))+rng.choice([-3,-2,-1,1,2,3]))) if d>1 else tot_r; h=float('${TOTAL_HOURS:-0}'); w=max(1,min(6,int(math.ceil(h/4.0)))) if h>0 else 1; raw=[rng.uniform(0.58,1.48) for _ in range(w)]; s=sum(raw); cnts=[max(1,int(round(r*x/s))+rng.choice([-4,-3,-2,-1,1,2,3,4])) for x in raw]; base_m=int(round((h/w)*60)) if h>0 else 0; mins=[max(10,base_m+rng.randint(-15,14)) if base_m>30 else base_m for _ in range(w)]; res='$RESULTS'.split(','); raw_m=sum(cnts[idx] for idx,st in enumerate(res[:2]) if st!='success') if (w==3 and d==1) else 0; missed=min(int(round(cnts[2]*0.85)),raw_m); m3=min(300,int(round(mins[2]*(cnts[2]+missed)/max(1,cnts[2])))) if missed>0 else mins[2]; print(cnts[2]+missed, m3)")
          echo "Wave 3: running $W_READERS readers over $W_MINS minutes (days left: ${TOTAL_DAYS:-1})"
          SPREAD_MINUTES="$W_MINS" ./run-camoufox.sh "${{ inputs.article_url }}" "$W_READERS" "${{ inputs.seconds }}"

  wave-4:
    name: Wave 4
    needs: wave-3
    if: ${{ always() && !cancelled() && fromJSON(inputs.hours || '0') > 12 }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install
      - run: for a in 1 2 3 4; do npx playwright-core install-deps firefox && break; sudo apt-get update -y || true; sleep 15; done
      - uses: actions/cache@v4
        with:
          path: ~/.cache/camoufox
          key: camoufox-binary-${{ runner.os }}-v1
      - run: for a in 1 2 3 4 5; do test -f ~/.cache/camoufox/version.json && break; npx camoufox-js fetch && break; rm -rf ~/.cache/camoufox; sleep 15; done
      - name: Run Wave 4
        run: |
          chmod +x run-camoufox.sh
          read W_READERS W_MINS < <(python3 -c "import math,random; rng=random.Random(int('${{ github.run_id }}')); tot_r=max(1,int('${TOTAL_READERS:-30}')); d=max(1,int(float('${TOTAL_DAYS:-1}'))); r=max(1,min(tot_r-(d-1),int(round((tot_r/d)*rng.uniform(0.76,1.28)))+rng.choice([-3,-2,-1,1,2,3]))) if d>1 else tot_r; h=float('${TOTAL_HOURS:-0}'); w=max(1,min(6,int(math.ceil(h/4.0)))) if h>0 else 1; raw=[rng.uniform(0.58,1.48) for _ in range(w)]; s=sum(raw); cnts=[max(1,int(round(r*x/s))+rng.choice([-4,-3,-2,-1,1,2,3,4])) for x in raw]; base_m=int(round((h/w)*60)) if h>0 else 0; mins=[max(10,base_m+rng.randint(-15,14)) if base_m>30 else base_m for _ in range(w)]; print(cnts[3], mins[3])")
          echo "Wave 4: running $W_READERS readers over $W_MINS minutes (days left: ${TOTAL_DAYS:-1})"
          SPREAD_MINUTES="$W_MINS" ./run-camoufox.sh "${{ inputs.article_url }}" "$W_READERS" "${{ inputs.seconds }}"

  wave-5:
    name: Wave 5
    needs: wave-4
    if: ${{ always() && !cancelled() && fromJSON(inputs.hours || '0') > 16 }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install
      - run: for a in 1 2 3 4; do npx playwright-core install-deps firefox && break; sudo apt-get update -y || true; sleep 15; done
      - uses: actions/cache@v4
        with:
          path: ~/.cache/camoufox
          key: camoufox-binary-${{ runner.os }}-v1
      - run: for a in 1 2 3 4 5; do test -f ~/.cache/camoufox/version.json && break; npx camoufox-js fetch && break; rm -rf ~/.cache/camoufox; sleep 15; done
      - name: Run Wave 5
        run: |
          chmod +x run-camoufox.sh
          read W_READERS W_MINS < <(python3 -c "import math,random; rng=random.Random(int('${{ github.run_id }}')); tot_r=max(1,int('${TOTAL_READERS:-30}')); d=max(1,int(float('${TOTAL_DAYS:-1}'))); r=max(1,min(tot_r-(d-1),int(round((tot_r/d)*rng.uniform(0.76,1.28)))+rng.choice([-3,-2,-1,1,2,3]))) if d>1 else tot_r; h=float('${TOTAL_HOURS:-0}'); w=max(1,min(6,int(math.ceil(h/4.0)))) if h>0 else 1; raw=[rng.uniform(0.58,1.48) for _ in range(w)]; s=sum(raw); cnts=[max(1,int(round(r*x/s))+rng.choice([-4,-3,-2,-1,1,2,3,4])) for x in raw]; base_m=int(round((h/w)*60)) if h>0 else 0; mins=[max(10,base_m+rng.randint(-15,14)) if base_m>30 else base_m for _ in range(w)]; print(cnts[4], mins[4])")
          echo "Wave 5: running $W_READERS readers over $W_MINS minutes (days left: ${TOTAL_DAYS:-1})"
          SPREAD_MINUTES="$W_MINS" ./run-camoufox.sh "${{ inputs.article_url }}" "$W_READERS" "${{ inputs.seconds }}"

  wave-6:
    name: Wave 6
    needs: [wave-1, wave-2, wave-3, wave-4, wave-5]
    if: ${{ always() && !cancelled() && fromJSON(inputs.hours || '0') > 20 }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install
      - run: for a in 1 2 3 4; do npx playwright-core install-deps firefox && break; sudo apt-get update -y || true; sleep 15; done
      - uses: actions/cache@v4
        with:
          path: ~/.cache/camoufox
          key: camoufox-binary-${{ runner.os }}-v1
      - run: for a in 1 2 3 4 5; do test -f ~/.cache/camoufox/version.json && break; npx camoufox-js fetch && break; rm -rf ~/.cache/camoufox; sleep 15; done
      - name: Run Wave 6 (with automatic catch-up for any skipped waves)
        run: |
          chmod +x run-camoufox.sh
          RESULTS="${{ needs.wave-1.result }},${{ needs.wave-2.result }},${{ needs.wave-3.result }},${{ needs.wave-4.result }},${{ needs.wave-5.result }}"
          read W_READERS W_MINS < <(python3 -c "import math,random; rng=random.Random(int('${{ github.run_id }}')); tot_r=max(1,int('${TOTAL_READERS:-30}')); d=max(1,int(float('${TOTAL_DAYS:-1}'))); r=max(1,min(tot_r-(d-1),int(round((tot_r/d)*rng.uniform(0.76,1.28)))+rng.choice([-3,-2,-1,1,2,3]))) if d>1 else tot_r; h=float('${TOTAL_HOURS:-0}'); w=max(1,min(6,int(math.ceil(h/4.0)))) if h>0 else 1; raw=[rng.uniform(0.58,1.48) for _ in range(w)]; s=sum(raw); cnts=[max(1,int(round(r*x/s))+rng.choice([-4,-3,-2,-1,1,2,3,4])) for x in raw]; base_m=int(round((h/w)*60)) if h>0 else 0; mins=[max(10,base_m+rng.randint(-15,14)) if base_m>30 else base_m for _ in range(w)]; res='$RESULTS'.split(','); raw_m=sum(cnts[idx] for idx,st in enumerate(res[:w-1]) if st!='success') if d==1 else 0; missed=min(int(round(cnts[5]*0.85)),raw_m); m6=min(300,int(round(mins[5]*(cnts[5]+missed)/max(1,cnts[5])))) if missed>0 else mins[5]; print(cnts[5]+missed, m6)")
          echo "Wave 6: running $W_READERS readers over $W_MINS minutes (earlier results: $RESULTS, days left: ${TOTAL_DAYS:-1})"
          SPREAD_MINUTES="$W_MINS" ./run-camoufox.sh "${{ inputs.article_url }}" "$W_READERS" "${{ inputs.seconds }}"

  next-day:
    name: Auto-Dispatch Next Day
    needs: [wave-1, wave-2, wave-3, wave-4, wave-5, wave-6]
    if: ${{ always() && !cancelled() && fromJSON(inputs.days || '1') > 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
    steps:
      - name: Trigger next day campaign with remaining readers
        run: |
          RESULTS="${{ needs.wave-1.result }},${{ needs.wave-2.result }},${{ needs.wave-3.result }},${{ needs.wave-4.result }},${{ needs.wave-5.result }},${{ needs.wave-6.result }}"
          read REM_READERS REM_DAYS TODAY_SENT < <(python3 -c "import math,random; rng=random.Random(int('${{ github.run_id }}')); tot_r=max(1,int('${TOTAL_READERS:-30}')); d=max(1,int(float('${TOTAL_DAYS:-1}'))); r=max(1,min(tot_r-(d-1),int(round((tot_r/d)*rng.uniform(0.76,1.28)))+rng.choice([-3,-2,-1,1,2,3]))) if d>1 else tot_r; h=float('${TOTAL_HOURS:-0}'); w=max(1,min(6,int(math.ceil(h/4.0)))) if h>0 else 1; raw=[rng.uniform(0.58,1.48) for _ in range(w)]; s=sum(raw); cnts=[max(1,int(round(r*x/s))+rng.choice([-4,-3,-2,-1,1,2,3,4])) for x in raw]; res='$RESULTS'.split(','); sent=sum(cnts[idx] for idx,st in enumerate(res[:w]) if st=='success'); rem_r=max(1,tot_r-sent); rem_d=max(1,d-1); print(rem_r, rem_d, sent)")
          echo "Today delivered $TODAY_SENT readers (wave results: $RESULTS). Dispatching next day ($REM_DAYS days left, $REM_READERS readers remaining)..."
          gh workflow run camoufox.yml --repo "${{ github.repository }}" \
            -f article_url="${{ inputs.article_url }}" \
            -f readers="$REM_READERS" \
            -f concurrency="${{ inputs.concurrency }}" \
            -f seconds="${{ inputs.seconds }}" \
            -f traffic="${{ inputs.traffic }}" \
            -f country="${{ inputs.country }}" \
            -f bounce_pct="${{ inputs.bounce_pct }}" \
            -f block_images="${{ inputs.block_images }}" \
            -f hours="${{ inputs.hours }}" \
            -f days="$REM_DAYS"
