          echo "Wave 4: running $W_READERS readers over $W_MINS minutes"
          SPREAD_MINUTES="$W_MINS" ./run-camoufox.sh "${{ inputs.article_url }}" "$W_READERS" "${{ inputs.seconds }}"

  wave-5:
    name: Wave 5
    needs: wave-4
    if: ${{ always() && !cancelled() && fromJSON(inputs.hours || '0') > 16 }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install
      - run: npx playwright-core install-deps firefox
      - uses: actions/cache@v4
        with:
          path: ~/.cache/camoufox
          key: camoufox-binary-${{ runner.os }}-v1
      - run: test -f ~/.cache/camoufox/version.json || npx camoufox-js fetch
      - name: Run Wave 5
        run: |
          chmod +x run-camoufox.sh
          read W_READERS W_MINS < <(python3 -c "import math; r=int('${TOTAL_READERS:-30}'); h=float('${TOTAL_HOURS:-0}'); w=max(1,min(6,int(math.ceil(h/4.0)))) if h>0 else 1; i=5; print(max(1,(r//w)+(1 if i<=(r%w) else 0)), int(round((h/w)*60)) if h>0 else 0)")
          echo "Wave 5: running $W_READERS readers over $W_MINS minutes"
          SPREAD_MINUTES="$W_MINS" ./run-camoufox.sh "${{ inputs.article_url }}" "$W_READERS" "${{ inputs.seconds }}"

  wave-6:
    name: Wave 6
    needs: wave-5
    if: ${{ always() && !cancelled() && fromJSON(inputs.hours || '0') > 20 }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install
      - run: npx playwright-core install-deps firefox
      - uses: actions/cache@v4
        with:
          path: ~/.cache/camoufox
          key: camoufox-binary-${{ runner.os }}-v1
      - run: test -f ~/.cache/camoufox/version.json || npx camoufox-js fetch
      - name: Run Wave 6
        run: |
          chmod +x run-camoufox.sh
          read W_READERS W_MINS < <(python3 -c "import math; r=int('${TOTAL_READERS:-30}'); h=float('${TOTAL_HOURS:-0}'); w=max(1,min(6,int(math.ceil(h/4.0)))) if h>0 else 1; i=6; print(max(1,(r//w)+(1 if i<=(r%w) else 0)), int(round((h/w)*60)) if h>0 else 0)")
          echo "Wave 6: running $W_READERS readers over $W_MINS minutes"
          SPREAD_MINUTES="$W_MINS" ./run-camoufox.sh "${{ inputs.article_url }}" "$W_READERS" "${{ inputs.seconds }}"
